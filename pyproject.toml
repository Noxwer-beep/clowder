[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clowder"
version = "1.0.0"
description = "One front door for the lab: vantage, warden, bastet, whisker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maximilian Jatzkowski", email = "jatzkowski.maximilian@gmail.com" }]
keywords = ["homelab", "security", "dashboard", "cli", "orchestration"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = ["rich>=13"]

[project.optional-dependencies]
ui = ["flask>=2.3"]
full = ["flask>=2.3"]

[project.scripts]
clowder = "clowder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clowder.web" = ["templates/*.html", "static/*.css", "static/*.svg"]
